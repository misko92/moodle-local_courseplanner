name: Build release zip

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tag
        uses: actions/checkout@v6

      - name: Build courseplanner.zip with correct Moodle layout
        run: |
          mkdir -p dist/courseplanner
          # Copy everything EXCEPT git metadata and CI config into the top-level
          # courseplanner/ directory that Moodle's plugin installer expects.
          rsync -av \
              --exclude='.git' \
              --exclude='.github' \
              --exclude='dist' \
              --exclude='*.zip' \
              ./ dist/courseplanner/
          cd dist
          zip -r ../courseplanner.zip courseplanner
          cd ..
          echo "Zip contents (first 15 entries):"
          unzip -l courseplanner.zip | head -20

      - name: Verify zip structure
        run: |
          # Moodle requires exactly one top-level directory named "courseplanner/".
          TOPLEVEL=$(unzip -l courseplanner.zip | awk 'NR>3 && $4 ~ /^[^\/]+\/$/ {print $4}' | sort -u)
          echo "Top-level directories in zip: $TOPLEVEL"
          if [ "$TOPLEVEL" != "courseplanner/" ]; then
            echo "::error::Zip must contain a single top-level directory named 'courseplanner/'"
            exit 1
          fi
          # Check version.php is at the expected path.
          if ! unzip -l courseplanner.zip | grep -q 'courseplanner/version.php'; then
            echo "::error::courseplanner/version.php missing from zip"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: courseplanner.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
